<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Мій Планувальник</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #f8fafc);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .accent-bg {
      background-color: var(--tg-theme-button-color, #3b82f6);
    }
    .accent-text {
      color: var(--tg-theme-button-color, #3b82f6);
    }
    .card-bg {
      background-color: var(--tg-theme-secondary-bg-color, #1e293b);
    }
    .task-checkbox:checked + div {
      text-decoration: line-through;
      opacity: 0.5;
    }
    /* Hide scrollbar for clean UI */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="p-4 pb-24 max-w-md mx-auto min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <div>
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-3">
        <div id="user-avatar" class="w-10 h-10 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold text-lg border border-blue-500/30">
          U
        </div>
        <div>
          <h1 id="user-greeting" class="font-bold text-lg leading-tight">Привіт! 👋</h1>
          <p class="text-xs text-slate-400">Твої плани на сьогодні</p>
        </div>
      </div>
      <span class="text-xs px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 font-medium border border-blue-500/20" id="current-date">
        Сьогодні
      </span>
    </div>

    <!-- Date Strip Selector -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar mb-6 pb-1" id="date-selector">
      <!-- Generated by JS -->
    </div>

    <!-- Progress Card -->
    <div class="card-bg p-4 rounded-2xl mb-6 shadow-lg border border-slate-700/40">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Прогрес дня</span>
        <span class="text-xs font-bold accent-text" id="progress-percent">0%</span>
      </div>
      <div class="w-full bg-slate-700/50 rounded-full h-2.5 overflow-hidden">
        <div id="progress-bar" class="accent-bg h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
      <p class="text-xs text-slate-400 mt-2" id="progress-text">Немає запланованих задач</p>
    </div>

    <!-- Filter Tabs -->
    <div class="flex gap-2 mb-4">
      <button onclick="setFilter('all')" id="filter-all" class="flex-1 py-1.5 text-xs font-medium rounded-xl transition accent-bg text-white shadow">Всі</button>
      <button onclick="setFilter('active')" id="filter-active" class="flex-1 py-1.5 text-xs font-medium rounded-xl transition card-bg text-slate-400 border border-slate-700/50">В процесі</button>
      <button onclick="setFilter('completed')" id="filter-completed" class="flex-1 py-1.5 text-xs font-medium rounded-xl transition card-bg text-slate-400 border border-slate-700/50">Виконані</button>
    </div>

    <!-- Tasks List -->
    <div id="tasks-container" class="space-y-3">
      <!-- Tasks will be rendered here -->
    </div>
  </div>

  <!-- Floating Add Button -->
  <button onclick="openModal()" class="fixed bottom-6 right-6 w-14 h-14 accent-bg rounded-full flex items-center justify-center text-white shadow-xl hover:scale-105 active:scale-95 transition-all duration-200">
    <i class="fa-solid fa-plus text-2xl"></i>
  </button>

  <!-- Add Task Modal -->
  <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-end justify-center z-50 transition-opacity">
    <div class="card-bg w-full max-w-md p-6 rounded-t-3xl border-t border-slate-700/50 animate-slide-up">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg">Новий план</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <form onsubmit="addTask(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Що потрібно зробити?</label>
          <input type="text" id="task-title" required placeholder="Наприклад: Вивчити урок Python" class="w-full px-4 py-3 rounded-xl bg-slate-900/60 border border-slate-700/60 focus:outline-none focus:border-blue-500 text-sm">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Час</label>
            <input type="time" id="task-time" class="w-full px-4 py-2.5 rounded-xl bg-slate-900/60 border border-slate-700/60 focus:outline-none focus:border-blue-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Пріоритет</label>
            <select id="task-priority" class="w-full px-3 py-2.5 rounded-xl bg-slate-900/60 border border-slate-700/60 focus:outline-none focus:border-blue-500 text-sm">
              <option value="low">🟢 Низький</option>
              <option value="medium" selected>🟡 Середній</option>
              <option value="high">🔴 Високий</option>
            </select>
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 accent-bg rounded-xl font-bold text-sm text-white shadow-lg active:scale-98 transition mt-2">
          Зберегти план
        </button>
      </form>
    </div>
  </div>

  <script>
    // Telegram WebApp Initialization
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      
      // Personalize greeting
      if (tg.initDataUnsafe?.user) {
        const user = tg.initDataUnsafe.user;
        document.getElementById('user-greeting').innerText = `Привіт, ${user.first_name}! 👋`;
        document.getElementById('user-avatar').innerText = user.first_name[0].toUpperCase();
      }
    }

    // App State
    let selectedDate = new Date().toISOString().split('T')[0];
    let currentFilter = 'all';
    let tasks = JSON.parse(localStorage.getItem('tg_mini_app_tasks') || '[]');

    // Dates Init
    function initDateSelector() {
      const dateContainer = document.getElementById('date-selector');
      dateContainer.innerHTML = '';
      
      const today = new Date();
      for (let i = -1; i < 6; i++) {
        const d = new Date();
        d.setDate(today.getDate() + i);
        const isoDate = d.toISOString().split('T')[0];
        
        const dayName = i === 0 ? 'Сьогодні' : d.toLocaleDateString('uk-UA', { weekday: 'short' });
        const dayNum = d.getDate();
        const isSelected = isoDate === selectedDate;

        const dateBtn = document.createElement('button');
        dateBtn.onclick = () => selectDate(isoDate);
        dateBtn.className = `flex-shrink-0 flex flex-col items-center justify-center w-14 py-2 rounded-2xl border transition-all ${
          isSelected 
            ? 'accent-bg border-blue-400 text-white shadow-md scale-105' 
            : 'card-bg border-slate-700/50 text-slate-400 hover:text-slate-200'
        }`;
        dateBtn.innerHTML = `
          <span class="text-[10px] uppercase font-semibold">${dayName}</span>
          <span class="text-base font-bold">${dayNum}</span>
        `;
        dateContainer.appendChild(dateBtn);
      }
      
      const options = { month: 'long', day: 'numeric' };
      document.getElementById('current-date').innerText = new Date(selectedDate).toLocaleDateString('uk-UA', options);
    }

    function selectDate(dateStr) {
      selectedDate = dateStr;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      initDateSelector();
      renderTasks();
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'active', 'completed'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (f === filter) {
          btn.className = 'flex-1 py-1.5 text-xs font-medium rounded-xl transition accent-bg text-white shadow';
        } else {
          btn.className = 'flex-1 py-1.5 text-xs font-medium rounded-xl transition card-bg text-slate-400 border border-slate-700/50';
        }
      });
      renderTasks();
    }

    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = '';

      let dayTasks = tasks.filter(t => t.date === selectedDate);
      
      // Update Progress
      const total = dayTasks.length;
      const completedCount = dayTasks.filter(t => t.completed).length;
      const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);

      document.getElementById('progress-bar').style.width = `${percent}%`;
      document.getElementById('progress-percent').innerText = `${percent}%`;
      document.getElementById('progress-text').innerText = total === 0 
        ? 'Немає запланованих задач на цей день' 
        : `Виконано ${completedCount} з ${total} завдань`;

      // Filter tasks
      if (currentFilter === 'active') dayTasks = dayTasks.filter(t => !t.completed);
      if (currentFilter === 'completed') dayTasks = dayTasks.filter(t => t.completed);

      if (dayTasks.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 text-slate-500">
            <i class="fa-regular fa-clipboard text-4xl mb-3 opacity-40"></i>
            <p class="text-xs">Список задач порожній</p>
          </div>
        `;
        return;
      }

      const priorityMap = {
        low: { icon: '🟢', label: 'Низький' },
        medium: { icon: '🟡', label: 'Середній' },
        high: { icon: '🔴', label: 'Високий' }
      };

      dayTasks.forEach(task => {
        const item = document.createElement('div');
        item.className = 'card-bg p-4 rounded-2xl flex items-center justify-between gap-3 border border-slate-700/40 shadow-sm transition hover:border-slate-600';
        
        item.innerHTML = `
          <div class="flex items-center gap-3 min-w-0 flex-1">
            <input type="checkbox" ${task.completed ? 'checked' : ''} 
                   onchange="toggleTask('${task.id}')"
                   class="task-checkbox w-5 h-5 rounded-md accent-blue-500 cursor-pointer">
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium leading-snug truncate ${task.completed ? 'line-through text-slate-500' : ''}">${task.title}</p>
              <div class="flex items-center gap-2 mt-1">
                ${task.time ? `<span class="text-[11px] text-slate-400"><i class="fa-regular fa-clock text-[10px]"></i> ${task.time}</span>` : ''}
                <span class="text-[10px] px-2 py-0.5 rounded-md bg-slate-800 text-slate-400 border border-slate-700">
                  ${priorityMap[task.priority]?.icon || ''}
                </span>
              </div>
            </div>
          </div>
          <button onclick="deleteTask('${task.id}')" class="text-slate-500 hover:text-red-400 p-2 transition">
            <i class="fa-regular fa-trash-can text-sm"></i>
          </button>
        `;
        container.appendChild(item);
      });
    }

    function addTask(e) {
      e.preventDefault();
      const title = document.getElementById('task-title').value.trim();
      const time = document.getElementById('task-time').value;
      const priority = document.getElementById('task-priority').value;

      if (!title) return;

      const newTask = {
        id: Date.now().toString(),
        date: selectedDate,
        title,
        time,
        priority,
        completed: false
      };

      tasks.push(newTask);
      saveTasks();
      closeModal();
      renderTasks();

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

      document.getElementById('task-title').value = '';
      document.getElementById('task-time').value = '';
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        renderTasks();
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('warning');
    }

    function saveTasks() {
      localStorage.setItem('tg_mini_app_tasks', JSON.stringify(tasks));
    }

    function openModal() {
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
    }

    // Initial Load
    initDateSelector();
    renderTasks();
  </script>
</body>
</html>
